name: Safie Auto Downloader (GAS Triggered Version)

on:
  repository_dispatch:
    types: [trigger_safie_download]
  workflow_dispatch:

jobs:
  check_job:
    runs-on: ubuntu-latest
    steps:
    - name: コードの読み込み
      uses: actions/checkout@v4

    - name: Pythonの準備
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 依存ライブラリのインストール
      run: |
        pip install selenium requests
        sudo apt-get update
        sudo apt-get install -y libnss3 libgbm1 libasound2t64 || sudo apt-get install -y libnss3 libgbm1 libasound2

    - name: rcloneのインストールと設定
      run: |
        sudo curl https://rclone.org/install.sh | sudo bash
        mkdir -p ~/.config/rclone
        cat << EOF > ~/.config/rclone/rclone.conf
        [drive]
        type = drive
        token = ${{ secrets.DRIVE_CREDENTIALS }}
        root_folder_id = 17lDpuOIqM7iLQPLm_1EVOHqBxEQ7195K
        EOF

    # 1. まず動画をダウンロード＆ローカルに解凍（ここではまだ通知を送らない）
    - name: 巡回プログラムの実行（ローカルへの動画展開）
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        SAFIE_ID: ${{ secrets.SAFIE_ID }}
        SAFIE_PW: ${{ secrets.SAFIE_PW }}
      run: python main.py

    # 2. 解凍された動画をGoogleドライブへ完全同期（フォルダが作成される）
    - name: Googleドライブへ確実・同期アップロード（100%同期待機）
      run: |
        if [ -d "/home/runner/upload_staging" ] && [ "$(ls -A /home/runner/upload_staging)" ]; then
          echo "🚀 ローカルに展開された動画を発見しました。Googleドライブへ確実に同期転送します..."
          rclone copy /home/runner/upload_staging drive: --verbose
          echo "✨ すべてのフォルダと動画のクラウド同期が200%完了しました！"
        else
          echo "📭 アップロード対象の動画はありませんでした。"
        fi

    # 3. アップロード完了後、確定したフォルダの個別URLを取得してGoogle Chatへ通知！
    - name: アップロード完了後にチャット通知を送信
      env:
        CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
      run: python main.py --notify-only
